<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Bibliothèque</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <div class="container">
        <header>
            <h1>Ma Bibliothèque</h1>
            <button type="button" id="logout-btn" class="logout-btn">Se déconnecter</button>
        </header>

        <section class="search-section">
            <div class="glass-panel">
                <div class="input-group">
                    <label for="search">Rechercher dans ma collection</label>
                    <div class="search-box">
                        <input type="text" id="search" placeholder="Titre ou auteur..." autocomplete="off">
                        <button type="button" id="clear-search" class="submit-btn" style="background-color: #64748b;">Tout</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="add-book-section">
            <div class="glass-panel">
                <form id="add-book-form">
                    <div class="input-group">
                        <label for="isbn">Ajouter un livre par ISBN</label>
                        <div class="search-box">
                            <input type="text" id="isbn" placeholder="Entrez l'ISBN (ex: 9782070415793)" required>
                            <button type="submit" class="submit-btn">Ajouter</button>
                        </div>
                    </div>
                    <div id="message" class="message"></div>
                </form>
            </div>
        </section>

        <main id="books-grid" class="books-grid">
            <div class="loader-container">
                <div class="loader"></div>
                <p>Chargement de votre collection...</p>
            </div>
        </main>
    </div>

    <div id="book-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-body">
                <div class="modal-header">
                    <img id="modal-cover" class="modal-cover" src="" alt="Couverture">
                    <div class="modal-title-author">
                        <h2 id="modal-title"></h2>
                        <p id="modal-authors"></p>
                    </div>
                </div>
                <div class="modal-details">
                    <p id="modal-description"></p>
                    <div class="modal-meta">
                        <span id="modal-pages"></span>
                        <span id="modal-date"></span>
                        <span id="modal-isbn"></span>
                        <span id="modal-editions"></span>
                    </div>
                    <div id="modal-subjects" class="modal-subjects">
                        <strong>Sujets:</strong> <span id="modal-subjects-list"></span>
                    </div>
                    <div id="modal-author-details" class="modal-author-details">
                        <strong>À propos de l'auteur:</strong>
                        <div id="modal-author-bio"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
