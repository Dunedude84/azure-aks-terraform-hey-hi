apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: devops-lab
  labels:
    app: webapp
    tags.datadoghq.com/env: "prod"
    tags.datadoghq.com/service: "devops-vault-web"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
        tags.datadoghq.com/env: "prod"
        tags.datadoghq.com/service: "devops-vault-web"
      annotations:
        # Annotations d'observabilité Datadog (atout mentionné dans l'offre Devolutions)
        ad.datadoghq.com/webapp.check_names: '["http_check"]'
        ad.datadoghq.com/webapp.init_configs: '[{}]'
        ad.datadoghq.com/webapp.instances: '[{"name": "webapp-health", "url": "http://%%host%%:8080/healthz"}]'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          image: webapp:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: APP_ENV
              value: "kubernetes-aks"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-service
  namespace: devops-lab
spec:
  # ClusterIP suffit car Cloudflare Tunnel route le trafic de l'intérieur du cluster !
  type: ClusterIP
  selector:
    app: webapp
  ports:
    - port: 80
      targetPort: 8080
