# ============================================================================
# Application 1 : hey-hi.ca (Gestion d'horaires - Node.js / Express port 3000)
# ============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: horaire-app
  namespace: hey-hi
  labels:
    app: horaire-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: horaire-app
  template:
    metadata:
      labels:
        app: horaire-app
    spec:
      containers:
        - name: horaire-app
          image: acrdevolutionslaba0onk.azurecr.io/hey-hi-horaire:v1.0.2
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: horaire-env
          env:
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /login.html
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login.html
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: horaire-service
  namespace: hey-hi
spec:
  type: ClusterIP
  selector:
    app: horaire-app
  ports:
    - port: 80
      targetPort: 3000
---
# ============================================================================
# Application 2 : biblio.hey-hi.ca (Ma Bibliothèque - Node.js / Express port 3001)
